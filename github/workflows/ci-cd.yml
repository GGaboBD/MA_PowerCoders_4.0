name: CI CD Avianca

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integracion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: node --check search.js

      - run: npm test

  despliegue:
    needs: integracion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          echo "Pipeline CI superado con exito en verde."
          echo "Desplegando incremento a produccion..."
